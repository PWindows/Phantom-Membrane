name: Build Phantom Membrane rootfs (from scratch)

on:
  push:
    paths:
      - 'membrane.c'
      - '.github/workflows/build-membrane.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools linux-libc-dev

      - name: Compile membrane statically
        run: musl-gcc -static -Os -o membrane membrane.c

      - name: Assemble rootfs
        run: |
          set -e
          ROOTFS="${{ runner.temp }}/rootfs"
          mkdir -p "$ROOTFS"/{dev,proc,sys,tmp,etc,server,runtime,bin,root,lib64,lib/x86_64-linux-gnu,usr/lib/x86_64-linux-gnu}

          cat > "$ROOTFS/etc/wsl.conf" <<'EOF'
          [automount]
          enabled=true
          root=/mnt/

          [interop]
          enabled=false
          appendWindowsPath=false
          EOF

          cat > "$ROOTFS/etc/wsl-distribution.conf" <<'EOF'
          [oobe]
          command = /bin/true
          defaultUid = 0
          defaultName = Phantom-Membrane

          [shortcut]
          enabled = false

          [windowsterminal]
          enabled = false
          EOF

          echo 'root:x:0:0:root:/root:/bin/sh' > "$ROOTFS/etc/passwd"
          echo 'root:*:19000:0:99999:7:::' > "$ROOTFS/etc/shadow"

          wget -q https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox -O busybox
          chmod +x busybox
          cp busybox "$ROOTFS/bin/"
          ln -s /bin/busybox "$ROOTFS/bin/sh"
          ln -s /bin/busybox "$ROOTFS/bin/mount"
          ln -s /bin/busybox "$ROOTFS/bin/umount"

                    # Add glibc runtime for dynamically-linked binaries (Java, etc.)
          mkdir -p "$ROOTFS/lib64"
          mkdir -p "$ROOTFS/lib/x86_64-linux-gnu"
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu"

          # Dynamic linker
          cp /lib64/ld-linux-x86-64.so.2 "$ROOTFS/lib64/"

          # Core glibc + C++ runtime
          cp -a /lib/x86_64-linux-gnu/libc.so.6         "$ROOTFS/lib/x86_64-linux-gnu/"
          cp -a /lib/x86_64-linux-gnu/libm.so.6         "$ROOTFS/lib/x86_64-linux-gnu/"
          cp -a /lib/x86_64-linux-gnu/libdl.so.2        "$ROOTFS/lib/x86_64-linux-gnu/" 2>/dev/null || true
          cp -a /lib/x86_64-linux-gnu/libpthread.so.0   "$ROOTFS/lib/x86_64-linux-gnu/" 2>/dev/null || true
          cp -a /lib/x86_64-linux-gnu/librt.so.1        "$ROOTFS/lib/x86_64-linux-gnu/" 2>/dev/null || true
          cp -a /lib/x86_64-linux-gnu/libz.so.1         "$ROOTFS/lib/x86_64-linux-gnu/"
          cp -a /lib/x86_64-linux-gnu/libstdc++.so.6    "$ROOTFS/lib/x86_64-linux-gnu/"
          cp -a /lib/x86_64-linux-gnu/libgcc_s.so.1     "$ROOTFS/lib/x86_64-linux-gnu/"

          # Also add /etc/ld.so.cache so the linker finds things fast
          mkdir -p "$ROOTFS/etc"
          /sbin/ldconfig -r "$ROOTFS" 2>/dev/null || true

          cp membrane "$ROOTFS/membrane"
          chmod 755 "$ROOTFS/membrane"

          tar --numeric-owner --absolute-names -czf phantom-membrane.tar.gz -C "$ROOTFS" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-membrane-rootfs
          path: phantom-membrane.tar.gz